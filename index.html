<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E9EE;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}

#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* marca */

.g{background-size:cover;background-position:center}

.splash i{display:block;width:230px;height:180px;background:url(img/logo-color.webp) no-repeat;background-size:442px 345px;background-position:-108px -34px}
.splash.out{opacity:0;pointer-events:none}
.logo3{height:54px;width:auto;display:block}
.ehero{position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;margin-bottom:6px}.ehero .bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}.ehero.dk:before{background:linear-gradient(180deg,rgba(13,13,18,.45),rgba(13,13,18,.82))}.ehero .bg.gs{filter:hue-rotate(275deg) saturate(1.6) contrast(1.1)}.ehero:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(13,13,18,0) 20%,rgba(13,13,18,.85))}.ehero>*{position:relative;z-index:2}.ehero>.bg{position:absolute;z-index:0}.ehero span{font-size:22px;font-weight:500}.ehero h1{margin:0 0 6px;color:#fff;font-size:44px}.ehero p{margin:0;color:#e6e6ee;font-size:17px}.ehero>.mapb.big{position:absolute;top:16px;right:16px;width:52px;height:52px;z-index:3}
.pcard{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:24px;padding:14px;margin-bottom:12px;background:#fff}.pcard .pim{width:84px;height:84px;border-radius:18px;flex:none}.pcard .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.pcard .pt b{font-size:20px;letter-spacing:-.5px;line-height:1.15}.pcard .pt .mact{margin-top:6px;font-size:16px;padding:10px 12px}.mapb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;border:0}.off2{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-weight:700;font-size:14px;padding:5px 10px;border-radius:12px}.hrs{display:grid;gap:6px;margin-top:6px}.hrs button{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;white-space:nowrap;text-align:left;width:100%;transition:.15s}.hrs button.on{background:var(--sec,var(--ink));color:var(--secfg,#fff)}
.wl{position:absolute;inset:0;z-index:90;background:#0D0D12;color:#fff;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:28px 24px 24px;transition:opacity .5s,transform .5s}
.wl[hidden]{display:none}.wl.out{opacity:0;transform:scale(1.04);pointer-events:none}

.wl>.wlogo{margin-top:auto}.wl>.skip{margin-bottom:auto}.wl img.wlogo{height:78px;margin-bottom:18px}

.wl p{font-size:18px;line-height:1.4;color:#d8d8e2;margin:0 0 20px;max-width:340px}
.wl .els{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.wl .els b{padding:8px 14px;border-radius:20px;font-size:15px}
.wl input[type=text]{width:100%;max-width:340px;padding:15px 18px;border-radius:30px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:17px;text-align:center;margin-bottom:12px}
.wl input[type=text]::placeholder{color:#a9a9b8}
.wl .btn{max-width:340px;background:var(--corazon);color:#fff;font-size:20px;padding:18px}
.wl .skip{margin-top:14px;color:#a9a9b8;text-decoration:underline;font-size:15px}
@media(max-height:740px){.wl{padding:14px 20px calc(14px + env(safe-area-inset-bottom))}.wl img.wlogo{height:50px;margin-bottom:8px}.wl .wpill{margin-bottom:10px;padding:6px 12px}.wl h1{font-size:42px;letter-spacing:-2px;margin-bottom:10px}.wl p{font-size:16px;margin-bottom:12px}.wl .els{margin-bottom:12px}.wl .els b{padding:6px 11px;font-size:14px}.wl input[type=text]{padding:12px 16px;margin-bottom:10px}.wl .btn{padding:14px;font-size:18px}.wl .skip{margin-top:10px}}
@media(max-height:640px){.wl .els{display:none}.wl p{margin-bottom:14px}}
.hero small.hi{display:block;font-weight:800;letter-spacing:.5px;margin-bottom:6px;color:#fff;font-size:18px}
.mboard{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:84px;grid-auto-flow:dense;gap:6px;background:#0D0D12;border-radius:26px;padding:8px;margin-top:12px}
.mt{position:relative;border-radius:14px;overflow:hidden;border:3px solid;background:#222;padding:0}
.mt.b{grid-column:span 2;grid-row:span 2}.mt.w{grid-column:span 2}.mt.t{grid-row:span 2}
.mt img{width:100%;height:100%;object-fit:cover;display:block}
.mt .mtag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:9px;max-width:calc(100% - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .mlk{position:absolute;right:5px;top:5px;display:flex;align-items:center;gap:3px;font-size:11px;color:#fff;background:rgba(13,13,18,.6);padding:2px 6px;border-radius:9px}
.mt .mlk svg{fill:var(--corazon);stroke:var(--corazon)}
.mt .mine2{position:absolute;left:5px;top:5px;font-style:normal;font-size:10px;font-weight:800;background:#fff;color:#0D0D12;padding:2px 7px;border-radius:9px}
.mt .pend{position:absolute;inset:0;background:rgba(13,13,18,.55);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}.mc{padding:10px 14px;border-radius:20px;border:2px solid var(--c);font-weight:700;font-size:15px;background:#fff}.mc.on{background:var(--c);color:var(--f)}
.mprev{height:190px;border-radius:20px;background:var(--soft);display:grid;place-items:center;text-align:center;color:var(--mut);overflow:hidden}.mprev span{display:block;margin-top:6px;font-size:15px}.mprev img{width:100%;height:100%;object-fit:cover}
.mok{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;line-height:1.35;margin:14px 0 16px}.mok input{width:22px;height:22px;flex:none;margin-top:1px}
.mt.fr img{object-fit:contain;background:#000}
.mfr{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.mfr::-webkit-scrollbar{display:none}
.mf{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:16px;border:2px solid var(--line);font-weight:700;font-size:13px;background:#fff}
.mf i{width:44px;height:44px;border-radius:10px;border:2px solid rgba(13,13,18,.15);display:block}
.mf.on{border-color:var(--ink);background:var(--soft)}
.mbig{width:100%;max-height:52vh;object-fit:contain;border-radius:20px;background:#0D0D12;display:block}
.mural-card{width:100%;text-align:left;display:block;border-radius:28px;background:var(--corazon);color:#fff;padding:18px;position:relative;overflow:hidden}
.mural-card .th{display:flex;margin-bottom:12px}.mural-card .th i{width:64px;height:64px;border-radius:14px;border:3px solid #fff;background-size:cover;background-position:center;margin-right:-14px}
.mural-card b{display:block;font-size:26px;letter-spacing:-1px;line-height:1.05;margin-bottom:4px}.mural-card span{display:block;font-size:16px;opacity:.95;margin-bottom:12px}
.mural-card em{display:inline-block;font-style:normal;font-weight:800;background:#fff;color:#0D0D12;padding:10px 18px;border-radius:24px}
/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.logo{font-weight:900;line-height:.86;font-size:23px;letter-spacing:-1.2px;display:flex;gap:6px;align-items:flex-start}
.logo small{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;letter-spacing:0;margin-top:2px}
.back{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}
.hr{display:flex;align-items:center;gap:18px}
.demo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:1.5px}
.demo:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--corazon)}
.bell{position:relative;display:grid;place-items:center;width:36px;height:36px}
.bell b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--corazon);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
main{flex:1;overflow-y:auto;padding:20px 20px 28px;position:relative}
main.pad0{padding:0;overflow:hidden}
h1{font-size:40px;line-height:1;letter-spacing:-2.2px;font-weight:900;margin:6px 0 18px}
h2{font-size:23px;letter-spacing:-1px;font-weight:900;margin:26px 0 12px}
.mut{color:var(--mut)}
/* nav */
nav{display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;z-index:5}

nav button.on{color:#fff;width:76px}nav button.on.dk{color:var(--ink)}
/* ui */
.seg{display:flex;background:var(--soft);border-radius:18px;padding:5px;gap:4px;margin-bottom:16px}
.seg button{flex:1;padding:13px 6px;border-radius:14px;font-weight:700;text-align:center;line-height:1.1}
.seg button small{display:block;font-weight:500;font-size:13px;opacity:.8}
.seg button.on{background:var(--sec,var(--ink));color:var(--secfg,#fff)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:13px 22px;border-radius:30px;border:1.5px solid var(--line);font-weight:700;font-size:17px;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:30px;background:var(--sec,var(--blue));color:var(--secfg,#fff);font-weight:800;font-size:18px}
.btn.out{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.dis{background:#fff;color:var(--mut);border:2px solid var(--line);pointer-events:none}
.btn.out{color:var(--ink)}.btn.pink{background:var(--corazon)}
.btn.sm{padding:12px;font-size:16px}
.card{border:1.5px solid var(--line);border-radius:22px;padding:16px;background:#fff}
.link{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:var(--gris-l);font-weight:700;font-size:14px}
.tag.live{background:var(--corazon);color:#fff}
.tag.warn{background:#FFF1C9}
.tag.ok{background:var(--tierra-l)}
.tag.red{background:var(--fuego-l);color:#9b0010}
/* home */
.hero{border-radius:28px;background:#7DF2F2 url(img/libelula.webp) center 30%/cover;color:#fff;padding:26px 22px 22px;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.hero:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,0,178,.35) 0%,rgba(13,13,18,0) 38%,rgba(13,13,18,.88) 100%)}.hero>*{position:relative;z-index:2}.hero>.hv{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}.hero h1{margin:0 0 8px;font-size:44px;color:#fff}
.hero p{margin:0 0 14px;color:#cfcfd8;font-weight:500}
.blob{position:absolute;border-radius:38% 62% 55% 45%/50% 40% 60% 50%}

.hero .blob.c{width:90px;height:90px;background:var(--tierra);top:10px;left:-20px}
.hero .blob.d{width:70px;height:70px;background:var(--corazon);top:150px;right:-10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.big.dk{color:var(--ink)}.big{display:flex;align-items:center;gap:10px;padding:20px 12px;border-radius:24px;font-weight:800;font-size:18px;color:#fff}
.promo{display:flex;border:2px solid var(--ink);border-radius:24px;overflow:hidden;text-align:left;width:100%}
.promo .img{width:110px;background:url(img/hojas.webp) center/cover}
.promo div.t{padding:16px}
.promo small{font-weight:700;letter-spacing:1.2px;color:var(--mut)}
.promo b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.6px;margin:6px 0 8px}
.elems{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.elems{scroll-snap-type:x proximity;scroll-padding-left:20px;cursor:grab}.elems.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}.elems.drag .elem,.chips.drag .chip{pointer-events:none}.chips{cursor:grab}.chips.drag{cursor:grabbing;user-select:none}.elem{scroll-snap-align:start;flex:none;width:200px;height:200px;border-radius:26px;background:var(--ink) center/cover;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;text-align:left}
.elem{isolation:isolate;width:220px;height:220px}.elem:before{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(13,13,18,0) 40%,rgba(13,13,18,.78))}.elem>*{position:relative;z-index:3}.elem>.bg,.elem>.tint{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}.elem>.bg.gs{filter:hue-rotate(275deg) saturate(1.6) contrast(1.1)}.elem>.tint{display:none;z-index:1;background:var(--corazon);mix-blend-mode:multiply}.elem .blob{display:none}
.elem span{font-size:22px;font-weight:500}
.elem b{font-size:28px;font-weight:900;letter-spacing:-1.5px}
.soon{margin-top:26px;border:2px dashed var(--ink);border-radius:28px;padding:34px 22px;text-align:center;position:relative;overflow:hidden}
.soon .plus{width:60px;height:60px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.soon small{font-weight:800;letter-spacing:1.5px;color:var(--mut)}
.soon h3{margin:4px 0 8px;font-size:30px;letter-spacing:-1.4px;font-weight:900}
.game{margin:0 0 6px;border-radius:28px;background:#0D0D12;color:#fff;padding:22px;position:relative;overflow:hidden;display:flex;gap:16px;align-items:center}.game .seed{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 55%,transparent 70%);display:grid;place-items:center}.game small{font-weight:800;letter-spacing:1.4px;color:var(--corazon)}.game h3{margin:2px 0 6px;font-size:28px;letter-spacing:-1.2px;font-weight:900;line-height:1}.game p{margin:0 0 14px;color:#cfcfd8;line-height:1.35}.game .row2{display:flex;gap:10px;align-items:center}.game a.go{flex:1;text-align:center;background:var(--corazon);color:#fff;font-weight:800;padding:13px 14px;border-radius:26px;text-decoration:none}.game button.qrb{width:48px;height:48px;border-radius:50%;border:2px solid #fff;color:#fff;display:grid;place-items:center;flex:none}.foot{margin-top:22px;text-align:center;color:var(--mut);font-size:14px}
/* agenda */
.legend{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:17px}
.legend i{width:20px;height:28px;border-radius:7px;background:var(--sec,var(--blue));flex:none}
.mine{width:100%;display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:26px;padding:16px 18px;font-weight:800;font-size:19px;margin-bottom:16px}

.dhero{border-radius:28px;padding:22px;position:relative;overflow:hidden;margin-bottom:12px}
.dhero .tg{display:inline-block;background:var(--ink);color:#fff;font-weight:800;padding:8px 16px;border-radius:20px;font-size:16px}
.dhero h1{margin:14px 0 10px;font-size:46px;max-width:78%}
.dhero p{margin:0;font-size:19px;color:#2b2b33;max-width:90%}
.dhero .blob{width:150px;height:150px;top:-30px;right:-24px}
.info{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.info .ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;flex:none}
.info b{display:block;font-size:20px;letter-spacing:-.4px}
.info span{color:var(--mut);font-size:18px}
.info a{margin-left:auto}
.bar{height:9px;border-radius:5px;background:var(--gris-l);margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.cta{padding:12px 20px 14px;border-top:1px solid var(--line);background:#fff}
/* sheets */
.ov{position:absolute;inset:0;background:rgba(13,13,18,.5);z-index:20;display:flex;align-items:flex-end;animation:f .18s}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:30px 30px 0 0;padding:12px 20px 22px;animation:u .22s}
.sheet .grab{width:54px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet h3{margin:0;font-size:29px;letter-spacing:-1.3px;font-weight:900}

label{display:block;font-weight:800;font-size:18px;margin:16px 0 8px}
input[type=text],select{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:#fff;font-size:17px}
input.err{border-color:var(--fuego)}
.hint{color:var(--mut);font-size:15px;margin-top:8px}
.sum{background:var(--soft);border-radius:20px;padding:16px;margin-bottom:6px}
.sum b{font-size:22px;letter-spacing:-.5px}
.sum div{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:17px;color:#2b2b33}
.kv{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);font-size:18px}
.kv b{font-weight:800}
.note{display:flex;gap:12px;background:var(--agua-l);color:#0b3aa8;border-radius:18px;padding:16px;margin:16px 0;line-height:1.4}
.note.g{background:var(--soft);color:#2b2b33}
.toast{position:absolute;left:16px;right:16px;top:76px;z-index:40;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:d .25s}
.toast b{display:block}
@keyframes d{from{transform:translateY(-20px);opacity:0}}
/* tickets */
.photo{height:220px;border-radius:26px;position:relative;overflow:hidden;background:#0cc8cc url(img/g-cian.png) center 40%/cover;margin-bottom:6px}
.photo span{position:absolute;left:14px;bottom:14px;background:#fff;border-radius:20px;padding:9px 16px;font-weight:800;font-size:16px}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:12px;width:100%;text-align:left}
.opt.on{border:2px solid var(--ink);background:var(--soft)}
.opt .r{width:28px;height:28px;border-radius:50%;border:2px solid #aaa;flex:none}
.opt.on .r{border:8px solid var(--sec,var(--blue))}
.opt b{display:block;font-size:20px}
.opt span{color:var(--mut)}
.opt em{margin-left:auto;font-style:normal;font-weight:800;font-size:21px;letter-spacing:-.5px;white-space:nowrap}
.step{display:flex;align-items:center;gap:20px}
.step button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.step b{font-size:24px;min-width:24px;text-align:center}
.tk{border:2.5px solid var(--ink);border-radius:30px;padding:20px;margin-bottom:16px;position:relative}
.tk .top{display:flex;justify-content:space-between;gap:10px}
.tk h3{font-size:38px;letter-spacing:-1.8px;margin:10px 0 8px}
.tk code{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px;font-size:17px}
.tk hr{border:0;border-top:2px dashed var(--line);margin:16px 0}
.qr{position:relative;flex:none}
.qr svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);background:var(--corazon);font-weight:900;font-size:11px;padding:6px 10px;white-space:nowrap;border:2px solid #fff;letter-spacing:.3px}
.qr.big .stamp{font-size:15px;padding:8px 14px}

.sw:after{content:"";position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:.15s}

.search input{border:0;outline:0;flex:1;font-size:18px;min-width:0}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:10px}

.mcard .x{margin-left:auto}

.ref{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;width:100%;text-align:left}

const MW=1920,MH=1080,Z0={z:2.2,cx:1150,cy:600},SCALE=0.38;

const MF=['Todo','Escenarios','Charlas','Talleres','Stands','Servicios'];
const FC={Todo:'#0D0D12',Escenarios:COL.corazon,Charlas:COL.tierra,Talleres:COL.tierra,Stands:COL.fuego,Servicios:'#0D0D12'};
const fgOn=c=>[COL.tierra,COL.aire].includes(c)?'#0D0D12':'#fff';

const GE='ing-inf inf-p1 p1-p2 p2-p3 p3-p4 p4-pe pe-esc p3-st2n st2n-n1 n1-n2 n2-ds1 ds1-ch2 ch2-ch ch-top1 top1-top2 top2-gas top2-bn bn-rep rep-l1 l1-ra ra-l2 l2-st4n l2-l3 l3-st5n l3-p4b p4b-p4 p4b-st3n st3n-p4 p1-p1b p1-p1c p1c-st1n ing-ra2n ing-e1 e1-insta insta-jar p2-wc2 st5n-ds3 wc2-ds3'.split(' ').map(e=>e.split('-'));
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function gpath(a,b){const D={},P={},Q=new Set(Object.keys(GN));Object.keys(GN).forEach(k=>D[k]=1e9);D[a]=0;
 while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(u===b)break;
  GE.forEach(([x,y])=>{const o=x===u?y:y===u?x:null;if(!o||!Q.has(o))return;const d=D[u]+dist(GN[u],GN[o]);if(d<D[o]){D[o]=d;P[o]=u}})}
 const r=[];let c=b;while(c){r.unshift(c);c=P[c]}return r}
const nearNode=(x,y)=>Object.keys(GN).reduce((m,k)=>dist(GN[k],[x,y])<dist(GN[m],[x,y])?k:m,'ing');
function routePts(a,b){const n=gpath(a.node,b.nd);return[[a.x,a.y],...n.map(k=>GN[k]),[b.x,b.y]]}
function routeDist(a,b){const p=routePts(a,b);let d=0;for(let i=1;i<p.length;i++)d+=dist(p[i-1],p[i]);return Math.max(10,Math.round(d*SCALE/10)*10)}

function mapDraw(){

function qr(code,size,big){
 let h=0;for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
 const N=25;let sv='';const fin=(x,y)=>x<7&&y<7||x>N-8&&y<7||x<7&&y>N-8;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;
  if(fin(x,y)){const lx=x<7?x:x-(N-7),ly=y<7?y:y-(N-7);on=(lx===0||lx===6||ly===0||ly===6)||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}
  else if((x===7||x===N-8)&&y<8||(y===7||y===N-8)&&x<8||(x===7&&y>N-9)||(y===7&&x>N-9))on=false;
  else on=r()>.52;
  if(on)sv+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return`<div class="qr ${big?'big':''}" style="width:${size}px;height:${size}px"><svg viewBox="-1 -1 ${N+2} ${N+2}" fill="#0D0D12"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${sv}</svg><span class="stamp">DEMO · SIN VALIDEZ</span></div>`}

 document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const c=e.target.closest('.elems,.chips');if(!c)return;el=c;x0=e.clientX;s0=c.scrollLeft;moved=false});
 document.addEventListener('pointermove',e=>{if(!el)return;const dx=e.clientX-x0;if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add('drag')}if(moved)el.scrollLeft=s0-dx});
 const end=()=>{if(!el)return;const c=el;el=null;if(moved){c.classList.remove('drag');window._noclick=true;setTimeout(()=>window._noclick=false,60)}};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{if(window._noclick){e.stopPropagation();e.preventDefault()}},true);
 document.addEventListener('wheel',e=>{const c=e.target.closest('.elems,.chips');if(c&&Math.abs(e.deltaY)>Math.abs(e.deltaX)&&c.scrollWidth>c.clientWidth){e.preventDefault();c.scrollLeft+=e.deltaY}},{passive:false});
})();

/* ---------- bienvenida ---------- */
function showWelcome(){const w=$('#wl');if(!w)return;
 const cols=[COL.fuego,COL.aire,COL.agua,COL.tierra,COL.corazon];
 const bl='';
 w.innerHTML=bl+`<img class="wlogo" src="img/logo-magenta.png" alt="Bioferia"><span class="wpill">9, 10 Y 11 DE ABRIL · PALERMO</span>
 <h1>¡Activemos<br>el <em>cambio</em>!</h1>
 <p>Te damos la bienvenida a Bioferia 2027. Tres días para hacer, conectar, transformar, cuidar y celebrar. <b>El cambio empieza con vos.</b></p>
 <div class="els"><b style="background:${COL.fuego}">Hacer</b><b style="background:${COL.aire};color:#0D0D12">Conectar</b><b style="background:${COL.agua}">Transformar</b><b style="background:${COL.tierra};color:#0D0D12">Cuidar</b><b style="background:${COL.corazon}">Celebrar</b></div>
 <input id="wn" type="text" placeholder="Escribí tu nombre (opcional)" maxlength="24" autocomplete="given-name" value="${esc(S.name||'')}">
 <button class="btn" data-a="wgo">¡Entrar a Bioferia!</button><a class="skip" data-a="wgo" data-skip="1">Ahora no</a>`;
 w.hidden=false;w.classList.remove('out');logoApply()}
function logoApply(){if(LOGO)document.querySelectorAll('img[src*="logo-magenta"]').forEach(e=>e.src=LOGO)}
/* ---------- reloj ---------- */
let lastMin=-1;
function tick(force){
 const n=now(),min=Math.floor(n/60000);let changed=false;
 ACT.forEach(a0=>{const en=S.en[a0.id];if(!en||en.wl)return;const a=A(a0.id),k=a.id+'@'+a.st;
  if(S.notified[k])return;const m=(a.st-n)/60000;
  if(m<=en.remind&&m>0){S.notified[k]=1;changed=true;pushAviso('Empieza pronto',`“${a.t}” empieza a las ${hm(a.st)} en ${pl(a.pl).n}.`,'clock')}});
 if(changed)save();
 const dc=$('#dclock');if(dc)dc.innerHTML=`${fdate(n)} · <b>${hm(n)}</b>`;
 if(force||min!==lastMin){lastMin=min;if(!$('#ov')&&(force||['agenda','home'].includes(V.tab)&&(!V.sub||V.sub.startsWith('act:')||V.sub.startsWith('el:')||V.sub==='mis')))render();else if($('#ov')&&force&&V.tab!=='mapa')render()}
}
setInterval(()=>tick(false),1000);
/* logo: quita el fondo claro del PNG y lo agranda con bordes suaves */
let LOGO=null;
function logoClean(){const im=new Image();im.onload=()=>{try{const S=4,c=document.createElement('canvas');c.width=im.naturalWidth*S;c.height=im.naturalHeight*S;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);const id=x.getImageData(0,0,c.width,c.height),d=id.data;for(let i=0;i<d.length;i+=4){let a=Math.max(0,Math.min(1,1-d[i+1]/247));const t=Math.max(0,Math.min(1,(a-.3)/.4));a=t*t*(3-2*t);d[i]=255;d[i+1]=0;d[i+2]=178;d[i+3]=Math.round(a*255)}x.putImageData(id,0,0);LOGO=c.toDataURL('image/png');logoApply()}catch(e){}};im.src='img/logo-magenta.png'}
render();logoClean();if(!S.wel)showWelcome();tick(false);setTimeout(()=>{const e=$('#sp');e.classList.add('out');setTimeout(()=>e.remove(),600)},1100);
</script>
